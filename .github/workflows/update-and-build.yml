name: Update Dependencies and Build

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Update dependencies
        id: dependency_update
        run: |
          bun update
          if git diff --quiet -- package.json bun.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Dependencies
        if: steps.dependency_update.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Run Tests
        if: steps.dependency_update.outputs.changed == 'true'
        run: bun run test

      - name: Build Project
        if: steps.dependency_update.outputs.changed == 'true'
        run: bun run build

      - name: Commit and Push Updates
        run: |
          if git diff --quiet; then
            echo "No dependency updates found."
            exit 0
          fi

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "[WF]: Updated dependencies and built project"
          git pull --rebase origin main
          git push
